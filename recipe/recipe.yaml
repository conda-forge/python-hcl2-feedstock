schema_version: 1

context:
  version: 8.1.4

package:
  name: python-hcl2
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/p/python-hcl2/python_hcl2-${{ version }}.tar.gz
  sha256: b4145c930540e99e3e9b4f7de297775bdf856df29782a7abdb0916cbfcab7865

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools >=61.2.0
    - setuptools-scm
    - wheel
  run:
    - lark >=1.1.5,<2.0
    - regex >=2024.4.16
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - hcl2
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - '*'

about:
  summary: A parser for HCL2
  license: MIT
  license_file: LICENSE.txt
  homepage: https://github.com/amplify-education/python-hcl2

extra:
  recipe-maintainers:
    - RohitK89
    - mariusvniekerk
